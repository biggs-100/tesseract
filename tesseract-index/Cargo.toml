[package]
name = "tesseract-index"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1"
blake3 = "1"
serde_json = "1"
rayon = "1"
tracing = "0.1"
thiserror = "2"
parking_lot = "0.12"
tesseract-core = { path = "../tesseract-core" }
tesseract-common = { path = "../tesseract-common" }

[features]
legacy-locking = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "hnsw_bench"
harness = false

[[bench]]
name = "merkle"
harness = false

