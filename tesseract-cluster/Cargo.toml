[package]
name = "tesseract-cluster"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"

[dependencies]
axum = { version = "0.7", features = ["json"] }
clap = { version = "4", features = ["derive"] }
etcd-client = { version = "0.13", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tesseract-core = { path = "../tesseract-core" }
tesseract-common = { path = "../tesseract-common" }
tesseract-storage = { path = "../tesseract-storage" }

[dev-dependencies]
tempfile = "3"

[features]
default = []
etcd = ["etcd-client"]
