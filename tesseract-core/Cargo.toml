[package]
name = "tesseract-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tracing = "0.1"
thiserror = "2"
tesseract-common = { path = "../tesseract-common" }
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
openai-embedding = ["reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
