[package]
name = "tesseract-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"
description = "MCP server for Tesseract — let AI agents search and insert vectors via the Model Context Protocol"

[dependencies]
rmcp = { version = "0.1", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"

[[bin]]
name = "tesseract-mcp"
path = "src/main.rs"
