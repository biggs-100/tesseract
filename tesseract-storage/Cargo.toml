[package]
name = "tesseract-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"

[dependencies]
tesseract-core = { path = "../tesseract-core" }
tesseract-common = { path = "../tesseract-common" }
tesseract-index = { path = "../tesseract-index" }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros", "time"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
dashmap = "6"
lru = "0.12"
serde_json = "1"
zstd = { version = "0.13", default-features = false }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
